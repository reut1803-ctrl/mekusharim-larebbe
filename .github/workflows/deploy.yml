name: Deploy to GitHub Pages

# בכל דחיפה ל-main: בונים את האתר הסטטי ודוחפים אותו לענף gh-pages,
# שממנו GitHub Pages מגיש את האתר. שיטה זו לא דורשת את ה-API של Pages
# (שאינו נגיש לאסימון של הסביבה), ולכן היא עובדת אוטומטית ללא הגדרה ידנית.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Add .nojekyll
        run: touch ./out/.nojekyll
      - name: Publish to gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פרסום אוטומטי מ-${GITHUB_SHA}"
          # דחיפה מאולצת: הענף מכיל רק את תוצר הבנייה האחרון, בלי היסטוריה מצטברת
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
